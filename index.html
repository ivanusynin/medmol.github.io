<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Календарь МедМол УГМУ</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #f0f2f5;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .calendar-container {
            flex: 1;
            width: 100%;
            border: none;
            overflow: hidden;
        }
        .calendar-frame {
            width: 100%;
            height: 100%;
            min-height: 100vh;
            border: none;
            border-radius: 0;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <!-- Прямо встраиваем календарь -->
    <div class="calendar-container">
        <iframe 
            class="calendar-frame"
            src="https://calendar.yandex.ru/embed/month?&layer_ids=34342013&tz_id=Asia/Yekaterinburg&layer_names=МедМол%20УГМУ"
            frameborder="0"
            allowfullscreen>
        </iframe>
    </div>

    <!-- Подключаем SDK ВКонтакте -->
    <script src="https://vk.com/js/api/xd_connection.js?2"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Говорим ВК: приложение готово
            if (window.VK && window.VK.WebApp) {
                window.VK.WebApp.ready();
                window.VK.WebApp.expand(); // Открыть на весь экран
            }
        });
    </script>
</body>
</html>
