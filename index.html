<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>МедМол: Уровень 1</title>
    <meta name="theme-color" content="#e63946" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1d3557, #457b9d);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }
        .logo {
            width: 120px;
            height: 120px;
            background: #e63946;
            border-radius: 50%;
            margin: 40px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }
        h1 {
            font-size: 28px;
            margin-bottom: 12px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .level {
            display: inline-block;
            background: #ffd166;
            color: #1d3557;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 16px;
        }
        p {
            color: #fff;
            opacity: 0.9;
            font-size: 18px;
            margin-bottom: 40px;
        }
        .btn {
            display: block;
            width: 100%;
            max-width: 320px;
            margin: 20px auto;
            padding: 16px;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            color: #1d3557;
            background: #ffd166;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }
        .btn:hover {
            background: #f4a261;
            transform: translateY(-2px);
        }
        .footer {
            margin-top: 60px;
            color: #fff;
            opacity: 0.7;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🎓</div>
        <h1>Добро пожаловать в МедМол!</h1>
        <div class="level">Уровень 1: Расписание</div>
        <p>Пройдите обучение и получите доступ к расписанию</p>

        <button class="btn" id="start-btn">▶️ Начать обучение</button>
        <button class="btn" id="calendar-btn">📅 Открыть календарь</button>
        <button class="btn" id="website-btn">🌐 Официальный сайт УГМУ</button>

        <div class="footer">© 2025 МедМол УГМУ • Мини-игра для студентов</div>
    </div>

    <!-- SDK ВКонтакте -->
    <script src="https://vk.com/js/api/xd_connection.js?2"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.VK?.WebApp) {
                window.VK.WebApp.ready();
                window.VK.WebApp.expand();
            }

            const openLink = (url) => {
                if (window.VK?.WebApp) {
                    window.VK.WebApp.openLink(url);
                } else {
                    window.open(url, '_blank');
                }
            };

            document.getElementById('start-btn').addEventListener('click', () => {
                alert('🎯 Привет! Это обучающий уровень. Нажми "Календарь", чтобы перейти к расписанию.');
            });

            document.getElementById('calendar-btn').addEventListener('click', () => {
                openLink('https://calendar.yandex.ru/embed/public?hash=ВАШ_ХЭШ_ЗДЕСЬ&lang=ru');
            });

            document.getElementById('website-btn').addEventListener('click', () => {
                openLink('https://www.ugmu.ru');
            });
        });
    </script>
</body>
</html>
